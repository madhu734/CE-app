name: Signed Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Restore persistent signing key
        # The key is shared across all release versions.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing signing secret $variable. Restore the existing signing key and credentials."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/crick-english-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/crick-english-release.jks"             -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null

      - name: Allocate Android version
        run: |
          set -euo pipefail
          # Seconds since 2020 remain within Android's version-code limit until 2088.
          version_code=$(( $(date -u +%s) - 1577836800 ))
          echo "APP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Run tests, lint and build signed release
        env:
          ROBOLECTRIC_MAVEN_REPO: https://maven-central.storage-download.googleapis.com/maven2
          KEYSTORE_PATH: ${{ runner.temp }}/crick-english-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon --console plain \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-validation-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify signature and package release
        id: package
        env:
          EXPECTED_CERTIFICATE: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          test -n "$EXPECTED_CERTIFICATE"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          certificate=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
          if [[ "${certificate,,}" != "${EXPECTED_CERTIFICATE,,}" ]]; then
            echo "::error::APK signing certificate differs from the repository's persistent signing certificate."
            exit 1
          fi
          "$tools/aapt" dump badging "$apk" | sed -n '1p' > "$RUNNER_TEMP/apk-package.txt"
          export RELEASE_APK="$apk"
          python3 - <<'PY'
          import json, os, pathlib
          metadata = json.loads(pathlib.Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          entry = metadata["elements"][0]
          if metadata["applicationId"] != "org.crickenglish.app":
              raise SystemExit("Unexpected application ID")
          if entry["versionCode"] != int(os.environ["APP_VERSION_CODE"]):
              raise SystemExit("Unexpected Android version code")
          version = entry["versionName"]
          tag = "android-" + os.environ["APP_VERSION_CODE"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nversion={version}\n")
          PY
          mkdir -p release
          cp "$apk" release/Crick-English.apk
          cp "$RUNNER_TEMP/apk-signature.txt" release/signing-certificate.txt
          cp "$RUNNER_TEMP/apk-package.txt" release/package-info.txt
          (cd release && sha256sum Crick-English.apk > SHA256SUMS.txt)

      - name: Keep release build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Crick-English-${{ steps.package.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          latest=false
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            latest=true
          fi
          {
            printf 'Signed Android release for Crick English %s.\n\n' "$RELEASE_VERSION"
            printf -- '- Application ID %s\n' 'org.crickenglish.app'
            printf -- '- Android version code %s\n' "$APP_VERSION_CODE"
            printf -- '- Source commit %s\n' "$GITHUB_SHA"
            printf -- '- Download Crick-English.apk to install or update.\n'
            printf -- '- SHA256SUMS.txt verifies the download. signing-certificate.txt records the fixed signing identity.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Crick English $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest="$latest"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/crick-english-release.jks"
