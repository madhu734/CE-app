[versions]
agp = "8.6.1"
kotlin = "2.0.21"
composeBom = "2024.10.01"
activity = "1.9.3"
lifecycle = "2.8.7"
core = "1.15.0"
coroutines = "1.9.0"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coil-compose = { module = "io.coil-kt:coil-compose", version = "2.7.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.3" }
junit = { module = "junit:junit", version = "4.13.2" }
android-test-ext = { module = "androidx.test.ext:junit", version = "1.2.1" }
android-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
